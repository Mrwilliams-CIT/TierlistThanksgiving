:root{
  /* 1970s harvest kitchen: chocolate brown, burnt orange, harvest gold, avocado, cream */
  --blue:#9C3F16; --navy:#2B1810; --ink:#1A0E08; --dove:#F6EBD0; --dove-dim:#D7BE9C;
  --pumpkin:#E3A823; --line:rgba(246,235,208,.2);
  --b:#E3A823; --tm:#1A1A17; --orange:#C9561C; --avocado:#6E7B2B; --cran:#8E1F2F;
  --disp:'Caprasimo','Cooper Black',Georgia,serif;
  font-size:min(calc(100vw / 108), calc(100vh / 192));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Bricolage','Segoe UI',system-ui,sans-serif;color:var(--dove);
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

#stage{position:relative;width:108rem;height:192rem;background:var(--navy);overflow:hidden;touch-action:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- header ---------- */
.head{position:relative;padding:6rem 5rem 7rem;display:flex;align-items:flex-end;justify-content:space-between;gap:3rem}
.head h1{font-family:var(--disp);font-size:7.6rem;line-height:1;font-weight:400;max-width:72rem;text-shadow:0 .5rem 0 var(--ink)}
.head::after{content:'';position:absolute;left:4rem;right:4rem;bottom:2.4rem;height:2.4rem;border-radius:1.2rem;
  background:linear-gradient(var(--orange) 0 33.4%,var(--b) 33.4% 66.7%,var(--avocado) 66.7%)}
.head p{font-size:2.7rem;line-height:1.3;color:var(--dove-dim);margin-top:1.6rem;max-width:66rem}
.brand{flex:none;text-align:right}
.brand img{height:12rem;display:block;margin-left:auto;background:#fff;padding:1.2rem 1.6rem;border-radius:.8rem}
.brand .word{font-size:4.6rem;font-weight:800;letter-spacing:.02em;background:#fff;color:#25408C;
  padding:.6rem 1.8rem 1rem;border-radius:.8rem;display:inline-block}
.brand small{display:block;font-size:1.7rem;color:var(--dove-dim);margin-top:.8rem;line-height:1.25}

/* ---------- tier rows (TierMaker look) ---------- */
.tiers{margin:0 4rem;background:#000;border:.2rem solid #000;flex:none}
.row{display:flex;min-height:12.4rem;border-bottom:.2rem solid #000}
.row:last-child{border-bottom:0}
.row .lab{flex:none;width:16.6rem;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:1rem;font-size:2.5rem;line-height:1.2;font-weight:500;color:#333;border-right:.2rem solid #000}
.row .drop{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;min-height:12.4rem;background:var(--tm)}
.row.hot .drop{background:#34342E}
.tray.hot{filter:brightness(1.12)}
.row.aim .drop{box-shadow:inset 0 0 0 .3rem rgba(255,255,255,.3)}

/* ---------- tiles ---------- */
.tile{position:relative;width:12.4rem;height:12.4rem;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:.6rem;
  font-size:2rem;line-height:1.08;font-weight:800;color:#fff;
  text-shadow:0 0 .5rem rgba(0,0,0,.9),0 .15rem .3rem rgba(0,0,0,.9),0 0 .15rem #000;
  touch-action:none;cursor:grab}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile span{position:relative;pointer-events:none}
.tile.sel{outline:.5rem solid #fff;outline-offset:-.5rem;transform:scale(1.06);z-index:2}
.tile.lifting{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-3deg);
  box-shadow:0 1.6rem 3rem rgba(0,0,0,.6)}

/* ---------- tray + action bar ---------- */
.hint{margin:3.2rem 5rem 1.4rem;font-size:2.6rem;color:var(--dove-dim);display:flex;justify-content:space-between}
.hint b{color:var(--dove);font-weight:700}
.tray{margin:0 4.4rem;min-height:24.8rem;background-color:#F6EBD0;
  background-image:linear-gradient(90deg,rgba(142,31,47,.55) 50%,transparent 50%),linear-gradient(rgba(142,31,47,.55) 50%,transparent 50%);
  background-size:6.2rem 6.2rem;box-shadow:0 0 0 .6rem var(--ink);
  display:flex;flex-wrap:wrap;align-content:flex-start}
.tray:empty::after{content:'Table is cleared. Tap "See my results".';font-size:3rem;font-weight:800;margin:auto;color:var(--ink);background:#F6EBD0;padding:1.4rem 2.6rem;border-radius:1rem}
.bar{padding:3.4rem 4rem 4rem;display:flex;gap:2rem}
.btn{height:11rem;border-radius:1.4rem;font-size:3.6rem;font-weight:800;padding:0 4rem;
  background:var(--dove);color:var(--ink);flex:1;box-shadow:0 .9rem 0 var(--ink)}
.btn.ghostbtn{background:var(--navy);box-shadow:inset 0 0 0 .3rem var(--dove-dim),0 .9rem 0 var(--ink);color:var(--dove);flex:none}
.btn:disabled,.btn.go:disabled{background:#5A4130;color:#A58C73}
.btn.go{background:var(--pumpkin)}
.btn.go:disabled{background:#5A4130;color:#A58C73}
.btn:active:not(:disabled){transform:translateY(.6rem);box-shadow:0 .3rem 0 var(--ink)}

/* ---------- attract ---------- */
#attract .head h1{font-size:10rem;max-width:68rem}
.count{margin:0 5rem 2rem;font-size:2.8rem;color:var(--dove-dim)}
.count b{color:var(--dove)}
#attract .bar{flex-direction:column;align-items:stretch;padding:3.4rem 4rem 4.4rem}
#attract .btn{height:15rem;font-size:5rem;flex:none}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:translateY(-1rem)}94%{transform:none}}
#attract .btn{animation:nudge 6s infinite}

/* ---------- school block (shared by attract and results) ---------- */
.school{margin:0 4rem;display:flex;flex-direction:column;gap:2.4rem}
.mini{background:#000;border:.2rem solid #000}
.mini .row{min-height:7.6rem}
.mini .lab{width:14rem;font-size:2.4rem}
.mini .drop{min-height:7.6rem;padding:.9rem;gap:.8rem;align-items:center;align-content:center}
.pill{font-size:1.9rem;font-weight:700;padding:.7rem 1.3rem .9rem;border-radius:.7rem;white-space:nowrap}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.6rem}
.fact{background:var(--blue);border-radius:1.4rem;padding:2rem 2.2rem 2.4rem}
.fact h3{font-size:1.9rem;font-weight:600;color:var(--dove-dim)}
.fact strong{display:block;font-family:var(--disp);font-size:3.2rem;line-height:1.05;margin:.8rem 0 .7rem;font-weight:400}
.fact:nth-child(2){background:var(--avocado)} .fact:nth-child(3){background:#7A5A12}
.fact p{font-size:1.8rem;line-height:1.3;color:var(--dove-dim)}
.progs{display:grid;grid-template-columns:repeat(7,1fr);gap:1rem}
.prog{background:rgba(246,235,208,.09);border-radius:1rem;padding:1.2rem 1rem 1.4rem;text-align:center;min-height:9.4rem}

.prog i{display:block;font-style:normal;font-size:1.5rem;color:var(--dove-dim);margin-top:.2rem}

.prog.none{opacity:.45}
.sectitle{font-family:var(--disp);font-size:3rem;font-weight:400;margin:1rem 1rem -.6rem}
.empty{background:var(--blue);border-radius:1.4rem;padding:5rem 4rem;font-size:3.2rem;line-height:1.3;text-align:center}

/* ---------- about you sheet ---------- */
#who{background:rgba(20,10,5,.8);justify-content:center}
.sheet{background:var(--navy);border-radius:3rem;margin:0 3rem;padding:4.6rem 4rem 4.4rem;box-shadow:0 0 0 .5rem var(--b),0 2rem 6rem rgba(0,0,0,.6)}

.chips{display:grid;gap:1.2rem}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chip{min-height:7.6rem;border-radius:1.1rem;background:rgba(246,235,208,.1);font-size:2.5rem;font-weight:600;
  padding:1rem 1.8rem;text-align:left;display:flex;align-items:center;gap:1.4rem;line-height:1.1}
.chips.three .chip{justify-content:center;font-size:3rem;font-weight:700;min-height:9rem}
.chip b{flex:none;width:7.4rem;font-weight:800;color:var(--b)}
.chip.on{background:var(--dove);color:var(--ink)} .chip.on b{color:var(--blue)}
.namerow{display:flex;gap:1.4rem}
.field{height:9rem;border-radius:1.1rem;background:var(--ink);box-shadow:inset 0 0 0 .3rem var(--line);
  font-size:3.6rem;font-weight:700;padding:0 2.4rem;display:flex;align-items:center;flex:1;text-align:left}
.field.init{flex:none;width:26rem}
.field.on{box-shadow:inset 0 0 0 .4rem var(--b)}
.field i{font-style:normal;color:var(--dove-dim);font-weight:500;font-size:2.8rem}
.namemsg{font-size:2.1rem;color:var(--dove-dim);margin-top:1.2rem;min-height:2.8rem}
.namemsg.bad{color:#FF9AA8}
.keys{margin-top:1.4rem;display:flex;flex-direction:column;gap:.9rem}
.keys div{display:flex;gap:.9rem;justify-content:center}
.key{width:8.6rem;height:8.6rem;border-radius:1rem;background:rgba(246,235,208,.14);font-size:3.4rem;font-weight:700}
.key.wide{width:18rem;font-size:2.4rem}
.key:active{background:var(--dove);color:var(--ink)}
.sheet .bar{padding:3.6rem 0 1rem}

/* ---------- results ---------- */
#results .head{padding:3.5rem 5rem 6rem}
#results .head::after{bottom:2rem;height:1.8rem}
#results .brand .word{font-size:3.4rem} #results .brand small{display:none}
#results .me{margin-bottom:1.6rem}
#results .school{gap:1.5rem}
#results .mini .row,#results .mini .drop{min-height:6.4rem}
#results .mini .drop{padding:.7rem .9rem}
#results .pill{font-size:1.75rem}
#results .mini .lab{font-size:2.2rem}
#results .fact{padding:1.6rem 2rem 1.8rem} #results .fact strong{font-size:2.8rem}
#results .prog{min-height:8.6rem;padding:.9rem .8rem 1rem}
#results .bar{padding:2.4rem 4rem 4.4rem} #results .btn{height:9.6rem}
#results .head h1{font-size:6rem}
.me{margin:0 4rem 3rem;display:grid;grid-template-columns:34rem 1fr;gap:1.6rem}
.score{background:var(--dove);color:var(--ink);border-radius:1.4rem;padding:2.4rem 2.6rem;display:flex;flex-direction:column}
.score .num{font-family:var(--disp);font-size:10.5rem;font-weight:400;line-height:.95;color:var(--orange)}
.score .num sup{font-size:5rem;vertical-align:top;position:relative;top:1.2rem}
.score p{font-size:2.1rem;line-height:1.25;margin-top:1rem}
.score .tag{margin-top:auto;padding-top:2rem;font-size:2rem}
.score .tag b{display:block;font-family:var(--disp);font-size:3.3rem;line-height:1.05;font-weight:400;margin-top:.3rem}
.takes{background:var(--blue);border-radius:1.4rem;padding:2.2rem 2.6rem 2.6rem}
.takes h3,.pair h3{font-size:2.1rem;font-weight:600;color:var(--dove-dim);margin-bottom:1.2rem}
.take{display:flex;align-items:center;gap:1.4rem;padding:1rem 0;border-top:.2rem solid var(--line);font-size:2.3rem}
.take:first-of-type{border-top:0}
.take .pill{flex:none}
.take > span:last-child{margin-left:auto;white-space:nowrap;color:var(--dove-dim)}
.take > span:last-child b{display:inline-block;padding:.3rem 1rem .5rem;border-radius:.5rem;
  color:#333;font-weight:700;margin:0 .6rem 0 .6rem}
.pairs{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
.pair{background:rgba(246,235,208,.09);border-radius:1.4rem;padding:2.2rem 2.6rem 2.4rem}
.pair strong{font-family:var(--disp);font-size:3.8rem;font-weight:400;display:block;line-height:1.05}
.pair p{font-size:1.9rem;color:var(--dove-dim);margin-top:.8rem;line-height:1.3}
/* ---------- still there? ---------- */
#idle{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,10,5,.82)}
#idle.on{display:flex}
#idle div{background:var(--dove);color:var(--ink);border-radius:3rem;padding:5rem 6rem 6rem;text-align:center;width:80rem;box-shadow:0 0 0 .6rem var(--b)}
#idle h2{font-family:var(--disp);font-weight:400;font-size:7rem;line-height:1}
#idle p{font-size:3.2rem;margin:2rem 0 4rem}
#idle p b{font-size:4rem}
#idle .btn{width:100%;background:var(--orange);color:#fff}
.status{position:absolute;left:5rem;bottom:1.6rem;font-size:1.5rem;color:var(--dove-dim);opacity:.7}
@media (prefers-reduced-motion:reduce){#attract .btn{animation:none}}
</style>

<body>
<div id="stage">

  <!-- START SCREEN -->
  <section class="screen on" id="attract">
    <div class="head">
      <div><h1 class="js-title"></h1><p class="js-sub"></p></div>
      <div class="brand"></div>
    </div>
    <p class="count" id="count"></p>
    <div class="school" id="schoolA"></div>
    <div class="bar"><button class="btn go" id="startBtn">Tap to make your list</button></div>
    <div class="school" id="schoolA2"></div>
  </section>

  <!-- RANK SCREEN -->
  <section class="screen" id="rank">
    <div class="head">
      <div><h1 class="js-title"></h1><p>Drag each food into a row. Or tap a food, then tap a row.</p></div>
      <div class="brand"></div>
    </div>
    <div class="tiers" id="tiers"></div>
    <div class="hint"><span id="left"></span><b id="selmsg"></b></div>
    <div class="tray" id="tray"></div>
    <div class="bar">
      <button class="btn ghostbtn" id="resetBtn">Start over</button>
      <button class="btn go" id="doneBtn" disabled>See my results</button>
    </div>
  </section>

  <!-- RESULTS SCREEN -->
  <section class="screen" id="results">
    <div class="head">
      <div><h1 id="resTitle"></h1></div>
      <div class="brand"></div>
    </div>
    <div class="me" id="me"></div>
    <div class="school" id="schoolR"></div>
    <div class="bar"><button class="btn" id="finishBtn">Finish</button></div>
  </section>

  <!-- ABOUT YOU SHEET -->
  <section class="screen" id="who">
    <div class="sheet">
      <div class="step on" id="step1">
        <h2>Two quick taps about you</h2>
        <h3>I am a</h3>
        <div class="chips three" id="roles"></div>
        <h3 id="progLabel">My program</h3>
        <div class="chips two" id="progs"></div>
        <div class="bar">
          <button class="btn ghostbtn" id="backBtn">Back to my list</button>
          <button class="btn go" id="nextBtn" disabled>Next</button>
        </div>
      </div>
      <div class="step" id="step2">
        <h2>Want to find your food twin?</h2>
        <h3>Type your first name and last initial. Or leave it empty to skip.</h3>
        <div class="namerow">
          <button class="field on" id="fFirst"></button>
          <button class="field init" id="fInit"></button>
        </div>
        <p class="namemsg" id="nameMsg"></p>
        <div class="keys" id="keys"></div>
        <div class="bar">
          <button class="btn ghostbtn" id="back2Btn">Go back</button>
          <button class="btn go" id="sendBtn">Show my results</button>
        </div>
      </div>
    </div>
  </section>

  <div id="idle"><div><h2>Still there?</h2><p>Going back to the start in <b id="idleN">15</b> seconds.</p><button class="btn" id="idleBtn">Keep going</button></div></div>
  <div class="status" id="status"></div>
  <div class="status" style="left:auto;right:5rem">Food photos: Wikimedia Commons</div>
</div>

<script>
'use strict';
const TIERS = TOPIC.tiers, MAXT = TIERS.length - 1;
const $ = id => document.getElementById(id);
const ITEM = Object.fromEntries(TOPIC.items.map(i => [i.id, i]));
const N = TOPIC.items.length;

/* ---------------- small helpers ---------------- */
function textOn(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0C1433' : '#FFFFFF';
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(id){ const it = ITEM[id]; return `<span class="pill" style="background:${it.color};color:${textOn(it.color)}">${esc(it.name)}</span>`; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id || (id === 'who' && s.id === 'rank'))); }

/* ---------------- vote storage ---------------- */
// A vote: { r:{itemId:tierNumber}, p:programCode, g:'J'|'S'|'ST', n:name or null }
const store = { votes: [], mode: 'local', onChange: () => {} };
const LS_KEY = 'tierlist-' + TOPIC.id;
function validVote(v){ return v && v.r && TOPIC.items.every(i => Number.isInteger(v.r[i.id]) && v.r[i.id] >= 0 && v.r[i.id] <= MAXT); }
function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]').filter(validVote); } catch (e) { return []; } }
function saveLocal(v){ try { const a = loadLocal(); a.push(v); localStorage.setItem(LS_KEY, JSON.stringify(a)); } catch (e) {} }

async function initStore(){
  if (new URLSearchParams(location.search).has('demo')) { store.mode = 'demo'; store.votes = demoVotes(); $('status').textContent = 'Demo data. Not real votes.'; return; }
  store.votes = loadLocal();
  if (!SUPABASE.url || !SUPABASE.key) { $('status').textContent = 'Votes are saved on this screen only.'; return; }
  const api = SUPABASE.url.replace(/\/+$/, '') + '/rest/v1/tier_votes';
  const hdr = { apikey: SUPABASE.key, Authorization: 'Bearer ' + SUPABASE.key };
  store.send = async v => {
    const r = await fetch(api, { method: 'POST', headers: { ...hdr, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ topic: TOPIC.id, ranks: v.r, program: v.p, role: v.g, name: v.n }) });
    if (!r.ok) throw new Error('save failed');
  };
  const pull = async () => {
    try {
      const r = await fetch(`${api}?select=ranks,program,role,name&topic=eq.${encodeURIComponent(TOPIC.id)}&order=id.asc&limit=5000`, { headers: hdr });
      if (!r.ok) throw new Error('read failed');
      const rows = await r.json();
      store.mode = 'cloud'; $('status').textContent = '';
      store.votes = rows.map(x => ({ r: x.ranks, p: x.program || '', g: x.role, n: x.name || null })).filter(validVote);
      store.onChange();
    } catch (e) {
      $('status').textContent = 'Cannot reach the vote server. Showing votes from this screen.';
    }
  };
  store.pull = pull;
  await pull();
  setInterval(pull, REFRESH_SECONDS * 1000);
}
function addVote(v){
  store.votes.push(v);
  if (store.mode === 'demo') return;
  if (store.send) store.send(v).catch(() => saveLocal(v));   // if the server is down, keep it on this screen
  else saveLocal(v);
}

/* ---------------- math on the votes ---------------- */
function stats(votes){
  const out = {};
  for (const it of TOPIC.items) {
    const xs = votes.map(v => v.r[it.id]);
    const mean = xs.reduce((a, b) => a + b, 0) / (xs.length || 1);
    const sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / (xs.length || 1));
    out[it.id] = { mean, sd, tier: Math.min(MAXT, Math.max(0, Math.round(mean))) };
  }
  return out;
}
function distance(a, b){ let d = 0; for (const it of TOPIC.items) d += Math.abs(a.r[it.id] - b.r[it.id]); return d; }
function matchPct(d){ return Math.round(100 * (1 - d / (MAXT * N))); }

/* ---------------- school block ---------------- */
function renderSchool(el, votes, el2){
  if (votes.length < 3) {
    el.innerHTML = `<div class="empty">No school results yet.<br>The first few lists start the count.</div>`;
    if (el2) el2.innerHTML = '';
    return;
  }
  const st = stats(votes);
  const rows = TIERS.map((t, i) => {
    const ids = TOPIC.items.filter(it => st[it.id].tier === i).sort((a, b) => st[a.id].mean - st[b.id].mean);
    return `<div class="row"><div class="lab" style="background:${t.color}">${esc(t.name)}</div><div class="drop">${ids.map(it => pill(it.id)).join('')}</div></div>`;
  }).join('');

  const bySd = [...TOPIC.items].sort((a, b) => st[b.id].sd - st[a.id].sd);
  const fight = bySd[0], agree = bySd[bySd.length - 1];
  const staff = votes.filter(v => v.g === 'ST'), kids = votes.filter(v => v.g !== 'ST');
  let gapCard = `<div class="fact"><h3>Staff against students</h3><strong>Not enough staff yet</strong><p>This fills in after 3 staff members make a list.</p></div>`;
  if (staff.length >= 3 && kids.length >= 3) {
    const a = stats(staff), b = stats(kids);
    const g = [...TOPIC.items].sort((x, y) => Math.abs(a[y.id].mean - b[y.id].mean) - Math.abs(a[x.id].mean - b[x.id].mean))[0];
    gapCard = `<div class="fact"><h3>Staff against students</h3><strong>${esc(g.name)}</strong><p>Staff say ${esc(TIERS[a[g.id].tier].name)}. Students say ${esc(TIERS[b[g.id].tier].name)}.</p></div>`;
  }
  const progCards = PROGRAMS.map(([code]) => {
    const pv = votes.filter(v => v.p === code);
    if (pv.length < 2) return `<div class="prog none"><b>${code}</b><i>${pv.length} ${pv.length === 1 ? 'list' : 'lists'}</i></div>`;
    const ps = stats(pv);
    const top = [...TOPIC.items].sort((x, y) => ps[x.id].mean - ps[y.id].mean)[0];
    return `<div class="prog"><b>${code}</b><i>${pv.length} lists</i><em>${esc(top.name)}</em></div>`;
  }).join('');

  const top = `
    <p class="sectitle">How the school ranks them</p>
    <div class="mini">${rows}</div>`;
  const rest = `
    <div class="facts">
      <div class="fact"><h3>Biggest fight</h3><strong>${esc(fight.name)}</strong><p>People put this one all over the list.</p></div>
      <div class="fact"><h3>Most agreed on</h3><strong>${esc(agree.name)}</strong><p>Almost everyone says ${esc(TIERS[st[agree.id].tier].name)}.</p></div>
      ${gapCard}
    </div>
    <p class="sectitle">Top ${TOPIC.noun} by program</p>
    <div class="progs">${progCards}</div>`;
  if (el2) { el.innerHTML = top; el2.innerHTML = rest; } else el.innerHTML = top + rest;
}
function renderAttract(){
  const n = store.votes.length;
  $('count').innerHTML = n ? `<b>${n}</b> ${n === 1 ? 'list' : 'lists'} made so far` : '';
  renderSchool($('schoolA'), store.votes, $('schoolA2'));
}

/* ---------------- rank screen ---------------- */
let sel = null, drag = null;
function buildRank(){
  $('tiers').innerHTML = TIERS.map((t, i) => `<div class="row" data-tier="${i}"><div class="lab" style="background:${t.color}">${esc(t.label)}</div><div class="drop"></div></div>`).join('');
  const tray = $('tray'); tray.innerHTML = '';
  const order = [...TOPIC.items].sort(() => Math.random() - .5);   // new order for each person
  for (const it of order) {
    const d = document.createElement('div');
    d.className = 'tile'; d.dataset.id = it.id;
    d.style.background = it.color;
    d.innerHTML = `<span>${esc(it.name)}</span>`;
    const img = new Image();
    const tries = [it.img, ...['jpg', 'png', 'webp', 'jpeg'].map(x => `img/${it.id}.${x}`)].filter(Boolean);
    let k = 0;
    img.onload = () => { d.prepend(img); d.classList.add('photo'); };
    img.onerror = () => { if (++k < tries.length) img.src = tries[k]; };
    img.referrerPolicy = 'no-referrer'; img.alt = ''; img.src = tries[0];
    tray.append(d);
  }
  select(null); refresh();
}
function select(t){
  if (sel) sel.classList.remove('sel');
  sel = t; if (t) t.classList.add('sel');
  $('selmsg').textContent = t ? `Now tap a row for ${ITEM[t.dataset.id].name}` : '';
  document.querySelectorAll('#tiers .row').forEach(r => r.classList.toggle('aim', !!t));
}
function refresh(){
  const left = $('tray').children.length;
  $('left').textContent = left ? `${left} left to place` : 'Every food is placed';
  $('doneBtn').disabled = left > 0;
}
function zoneAt(x, y){
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const row = el.closest('#tiers .row'); if (row) return { zone: row.querySelector('.drop'), hot: row, over: el.closest('.tile') };
  const tray = el.closest('#tray'); if (tray) return { zone: tray, hot: tray, over: el.closest('.tile') };
  return null;
}
function clearHot(){ document.querySelectorAll('.hot').forEach(e => e.classList.remove('hot')); }
function endDrag(){
  if (!drag) return;
  if (drag.ghost) drag.ghost.remove();
  drag.t.classList.remove('lifting'); clearHot(); drag = null;
}
$('rank').addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile'); if (!t || drag) return;
  drag = { t, x: e.clientX, y: e.clientY, id: e.pointerId, ghost: null };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 14) return;
    select(null);
    const r = drag.t.getBoundingClientRect();
    drag.ghost = drag.t.cloneNode(true);
    drag.ghost.classList.add('ghost'); drag.ghost.style.width = r.width + 'px'; drag.ghost.style.height = r.height + 'px';
    document.body.append(drag.ghost); drag.t.classList.add('lifting');
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  clearHot(); const z = zoneAt(e.clientX, e.clientY); if (z) z.hot.classList.add('hot');
});
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const t = drag.t, wasDrag = !!drag.ghost;
  if (drag.ghost) drag.ghost.remove();
  const z = zoneAt(e.clientX, e.clientY);
  endDrag();
  if (wasDrag) {
    if (z) { if (z.over && z.over !== t) z.zone.insertBefore(t, z.over); else z.zone.append(t); }
    refresh();
  } else {
    select(sel === t ? null : t);       // a tap picks the food up or puts it down
  }
});
window.addEventListener('pointercancel', endDrag);
$('rank').addEventListener('click', e => {
  if (!sel || e.target.closest('.tile') || e.target.closest('button')) return;
  const row = e.target.closest('#tiers .row'), tray = e.target.closest('#tray');
  const zone = row ? row.querySelector('.drop') : tray;
  if (zone) { zone.append(sel); select(null); refresh(); }
});
function readRanks(){
  const r = {};
  document.querySelectorAll('#tiers .row').forEach(row => row.querySelectorAll('.tile').forEach(t => r[t.dataset.id] = +row.dataset.tier));
  return r;
}

/* ---------------- about you ---------------- */
const who = { g: null, p: null, first: '', init: '', field: 'first', step: 1 };
// Names that contain any of these are refused. Add more as needed.
const BLOCK = ['fuck','shit','bitch','ass','dick','cock','puss','cunt','fag','nig','slut','whore','penis','vag','sex','porn','rape','nazi','hitler','kkk','cum','tit','boob','damn','hell','poop','butt','anus','dildo','hoe','thot','retard','kill','die','69','420'];
const ALLOW = ['cassie','cassidy','cass','dickson','hassan','lassie','chase','dixie','tito','titus','kumiko','butters','michelle','mitchell','shelley','shelly','hellen','odie','eddie','freddie','maddie','addie','jodie','brodie','sadie','andie','birdie','goldie','charlie die'];
function badName(s){
  const x = s.toLowerCase();
  if (ALLOW.includes(x)) return false;
  return BLOCK.some(w => x.includes(w));
}
function buildWho(){
  $('roles').innerHTML = [['J','Junior'],['S','Senior'],['ST','Staff']].map(([k, n]) => `<button class="chip" data-g="${k}">${n}</button>`).join('');
  $('progs').innerHTML = PROGRAMS.map(([c, n]) => `<button class="chip" data-p="${c}"><b>${c}</b>${esc(n)}</button>`).join('');
  const rowsK = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  $('keys').innerHTML = rowsK.map((r, i) => `<div>${[...r].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}${i === 2 ? '<button class="key wide" data-k="DEL">Erase</button>' : ''}</div>`).join('');
}
function resetWho(){ Object.assign(who, { g: null, p: null, first: '', init: '', field: 'first', step: 1 }); drawWho(); }
function drawWho(){
  $('step1').classList.toggle('on', who.step === 1); $('step2').classList.toggle('on', who.step === 2);
  $('nextBtn').disabled = !(who.g && (who.p || who.g === 'ST'));
  document.querySelectorAll('#roles .chip').forEach(c => c.classList.toggle('on', c.dataset.g === who.g));
  document.querySelectorAll('#progs .chip').forEach(c => c.classList.toggle('on', c.dataset.p === who.p));
  $('progLabel').textContent = who.g === 'ST' ? 'My program. Staff can skip this.' : 'My program';
  $('fFirst').innerHTML = who.first ? esc(who.first) : '<i>First name</i>';
  $('fInit').innerHTML = who.init ? esc(who.init) + '.' : '<i>Last initial</i>';
  $('fFirst').classList.toggle('on', who.field === 'first');
  $('fInit').classList.toggle('on', who.field === 'init');
  const bad = who.first && badName(who.first);
  const half = !!who.first !== !!who.init;
  const msg = $('nameMsg');
  msg.className = 'namemsg' + (bad ? ' bad' : '');
  msg.textContent = bad ? 'That name cannot be used. Erase it and try again.'
    : half ? (who.first ? 'Add your last initial, or erase your name to skip.' : 'Add your first name, or erase the initial to skip.')
    : who.first ? `Your list will show as ${who.first} ${who.init}.` : '';
  $('sendBtn').disabled = !(who.g && (who.p || who.g === 'ST')) || bad || half;
  $('sendBtn').textContent = who.first ? 'Show my results' : 'Skip and show results';
}
$('roles').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { who.g = c.dataset.g; drawWho(); } });
$('progs').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { who.p = who.p === c.dataset.p ? null : c.dataset.p; drawWho(); } });
$('fFirst').addEventListener('click', () => { who.field = 'first'; drawWho(); });
$('fInit').addEventListener('click', () => { who.field = 'init'; drawWho(); });
$('keys').addEventListener('click', e => {
  const k = e.target.closest('.key'); if (!k) return;
  const key = k.dataset.k;
  if (key === 'DEL') { if (who.field === 'init') { if (who.init) who.init = ''; else who.field = 'first'; } else who.first = who.first.slice(0, -1); }
  else if (who.field === 'init') who.init = key;
  else if (who.first.length < 12) who.first += who.first ? key.toLowerCase() : key;
  drawWho();
});

/* ---------------- results ---------------- */
function tasteLabel(v, pct){
  const r = v.r, vals = Object.values(r);
  const has = (...ids) => ids.every(i => i in r);
  const avg = ids => ids.reduce((a, i) => a + r[i], 0) / ids.length;
  if (vals.filter(x => x === 0).length >= N / 2) return 'Loves it all';
  if (vals.filter(x => x >= MAXT - 1).length >= N / 2) return 'Tough critic';
  if (pct !== null && pct < 55) return 'Hot take machine';
  if (has('pumpkinpie','applepie') && r.pumpkinpie <= 1 && r.applepie <= 1) return 'Dessert first';
  if (has('turkey','ham','mashed','stuffing') && avg(['mashed','stuffing']) + 1 <= avg(['turkey','ham'])) return 'Side dish fan';
  if (has('turkey','ham') && avg(['turkey','ham']) <= .5) return 'Meat first';
  if (pct !== null && pct >= 85) return 'Crowd favorite';
  return 'Classic plate';
}
function renderResults(mine){
  const others = store.votes.filter(v => v !== mine);
  const enough = others.length >= 3;
  $('resTitle').textContent = mine.n ? `Here is your list, ${mine.n}` : 'Here is how your list stacks up';
  let html = '';
  if (!enough) {
    html = `<div class="empty" style="grid-column:1/-1">Your list is saved. You are one of the first, so there is not much to compare yet. Check this screen again later.</div>`;
  } else {
    const st = stats(others);
    let diff = 0; for (const it of TOPIC.items) diff += Math.abs(mine.r[it.id] - st[it.id].mean);
    const pct = Math.round(100 * (1 - diff / (MAXT * N)));
    const takes = [...TOPIC.items].map(it => ({ it, gap: Math.abs(mine.r[it.id] - st[it.id].mean) }))
      .sort((a, b) => b.gap - a.gap).slice(0, 3).filter(t => t.gap >= 1);
    const takeHtml = takes.length ? takes.map(({ it }) => `<div class="take">${pill(it.id)}<span>You<b style="background:${TIERS[mine.r[it.id]].color}">${esc(TIERS[mine.r[it.id]].name)}</b> School<b style="background:${TIERS[st[it.id].tier].color}">${esc(TIERS[st[it.id].tier].name)}</b></span></div>`).join('')
      : `<div class="take">No hot takes. Your list is very close to the school list.</div>`;
    html = `
      <div class="score"><div class="num">${pct}<sup>%</sup></div><p>That is how close your list is to the school list.</p>
        <div class="tag">Your style<b>${tasteLabel(mine, pct)}</b></div></div>
      <div class="takes"><h3>Your hottest takes</h3>${takeHtml}</div>`;
    const named = others.filter(v => v.n);
    if (named.length >= 2) {
      const ranked = named.map(v => ({ v, d: distance(mine, v) })).sort((a, b) => a.d - b.d);
      const tw = ranked[0], ne = ranked[ranked.length - 1];
      html += `<div class="pairs">
        <div class="pair"><h3>Your food twin</h3><strong>${esc(tw.v.n)}</strong><p>${matchPct(tw.d)}% the same list as you${tw.v.p ? ', from ' + tw.v.p : ''}.</p></div>
        <div class="pair"><h3>Your food opposite</h3><strong>${esc(ne.v.n)}</strong><p>Only ${matchPct(ne.d)}% the same${ne.v.p ? ', from ' + ne.v.p : ''}.</p></div></div>`;
    }
  }
  $('me').innerHTML = html;
  renderSchool($('schoolR'), store.votes);
}

/* ---------------- flow + idle reset ---------------- */
let idleT = null, warnT = null, tickT = null, current = 'attract', lastVote = null;
function clearIdle(){ clearTimeout(idleT); clearTimeout(warnT); clearInterval(tickT); $('idle').classList.remove('on'); }
function go(id){
  current = id; show(id); clearIdle();
  if (id === 'attract') { renderAttract(); return; }
  const secs = id === 'results' ? IDLE_RESULTS_SECONDS : IDLE_RANK_SECONDS;
  const warn = Math.min(IDLE_WARNING_SECONDS, secs - 1);
  warnT = setTimeout(() => {                 // show "Still there?" and count down
    let n = warn; $('idleN').textContent = n; $('idle').classList.add('on');
    tickT = setInterval(() => { $('idleN').textContent = Math.max(0, --n); }, 1000);
  }, (secs - warn) * 1000);
  idleT = setTimeout(() => { endDrag(); go('attract'); }, secs * 1000);
}
// any touch restarts the timer
window.addEventListener('pointerdown', () => { if (current !== 'attract') go(current); }, true);
$('startBtn').addEventListener('click', () => { buildRank(); resetWho(); go('rank'); });
$('resetBtn').addEventListener('click', () => { buildRank(); });
$('doneBtn').addEventListener('click', () => { select(null); who.step = 1; drawWho(); go('who'); });
$('backBtn').addEventListener('click', () => go('rank'));
$('nextBtn').addEventListener('click', () => { who.step = 2; drawWho(); });
$('back2Btn').addEventListener('click', () => { who.step = 1; drawWho(); });
$('sendBtn').addEventListener('click', () => {
  const v = { r: readRanks(), p: who.p || '', g: who.g, n: who.first ? `${who.first} ${who.init}.` : null };
  if (!validVote(v)) { go('rank'); return; }
  lastVote = v; addVote(v); renderResults(v); go('results');
});
$('finishBtn').addEventListener('click', () => go('attract'));
store.onChange = () => { if (current === 'attract') renderAttract(); };

/* ---------------- demo data (only with ?demo in the address) ---------------- */
function demoVotes(){
  const base = { mashed:.3, stuffing:.8, turkey:.9, rolls:.7, mac:.8, pumpkinpie:1, gravy:1.2, ham:1.4, applepie:1.2, corn:1.8,
    cornbread:1.9, sweetpotato:2.2, greenbean:2.5, cranberry:2.6, brussels:3.3, jellied:2.4 };
  const spread = { jellied:2.2, brussels:1.3, greenbean:1.5, cranberry:1.4 };
  const names = ['Avery','Jordan','Riley','Casey','Morgan','Quinn','Devon','Parker','Reese','Skyler','Emery','Rowan','Finley','Harper','Dakota','Sawyer'];
  const rnd = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
  const out = [];
  for (let i = 0; i < 84; i++) {
    const g = i % 9 === 0 ? 'ST' : i % 2 ? 'J' : 'S', r = {};
    for (const it of TOPIC.items) {
      let m = (base[it.id] ?? 2) + (g === 'ST' && it.id === 'brussels' ? -2 : 0);
      r[it.id] = Math.min(MAXT, Math.max(0, Math.round(m + rnd() * (spread[it.id] || 1))));
    }
    out.push({ r, g, p: PROGRAMS[(i * 5) % PROGRAMS.length][0],
      n: i % 3 ? `${names[i % names.length]} ${'ABCDGHJKLMPRSTW'[i % 15]}.` : null });
  }
  return out;
}

/* ---------------- start up ---------------- */
document.querySelectorAll('.js-title').forEach(e => e.textContent = TOPIC.title);
document.querySelectorAll('.js-sub').forEach(e => e.textContent = TOPIC.sub);
document.querySelectorAll('.brand').forEach(b => {
  b.innerHTML = '<span class="word">CCCTC</span><small>Columbiana County<br>Career and Technical Center</small>';

  logo.onload = () => { b.innerHTML = ''; b.append(logo); };
  logo.src = 'img/ccctc-logo.png'; logo.alt = 'CCCTC';
});
document.addEventListener('contextmenu', e => e.preventDefault());
buildWho(); renderAttract();
initStore().then(renderAttract);
